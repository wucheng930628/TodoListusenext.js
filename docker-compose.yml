services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local

    working_dir: /home/dynamodblocal

    command: >
      -jar DynamoDBLocal.jar
      -sharedDb
      -dbPath ./data

    ports:
      - "127.0.0.1:9000:8000"

    volumes:
      - ./data:/home/dynamodblocal/data

    restart: unless-stopped
